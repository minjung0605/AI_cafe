<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>바이브 카페 - 주문서</title>

  <!-- 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== 페이지 헤더 ===== -->
  <header class="cafe-header">
    <!-- 카페 로고 이모지 -->
    <div class="cafe-logo" aria-hidden="true">☕</div>

    <!-- 카페 이름 -->
    <h1 class="cafe-name">바이브 카페</h1>

    <!-- 부제 -->
    <p class="cafe-tagline">당신의 하루에 바이브를 더하다</p>
  </header>

  <!-- ===== 주문서 메인 영역 ===== -->
  <main class="order-container">

    <!-- ===== 탭 네비게이션 ===== -->
    <nav class="tab-nav" role="tablist" aria-label="페이지 탭">
      <!-- 주문하기 탭 버튼 (기본 활성) -->
      <button class="tab-btn active"
              id="tab-btn-order"
              role="tab"
              aria-selected="true"
              aria-controls="panel-order"
              data-tab="panel-order">
        ☕ 주문하기
      </button>

      <!-- 주문 내역 탭 버튼 + 건수 배지 -->
      <button class="tab-btn"
              id="tab-btn-history"
              role="tab"
              aria-selected="false"
              aria-controls="panel-history"
              data-tab="panel-history">
        📋 주문 내역
        <!-- 주문 건수 배지 (주문이 없으면 hidden, JavaScript가 제어) -->
        <span id="order-badge" class="order-badge hidden">0</span>
      </button>
    </nav>

    <!-- ===== 주문하기 탭 패널 ===== -->
    <div id="panel-order" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-order">

      <!--
        novalidate: 브라우저 기본 유효성 검사를 끄고 JavaScript로 직접 처리
      -->
      <form id="order-form" novalidate>

      <!-- 1. 이름 (필수) -->
      <div class="form-group">
        <label for="customer-name">
          이름 <span class="required" aria-label="필수">*</span>
        </label>
        <input
          type="text"
          id="customer-name"
          name="customer-name"
          placeholder="이름을 입력하세요"
          autocomplete="name"
          required
        />
        <!-- 이름 유효성 오류 메시지 (JavaScript가 표시/숨김 제어) -->
        <span class="error-msg" id="name-error" aria-live="polite"></span>
      </div>

      <!-- 2. 전화번호 -->
      <div class="form-group">
        <label for="customer-phone">전화번호</label>
        <input
          type="tel"
          id="customer-phone"
          name="customer-phone"
          placeholder="010-0000-0000"
          autocomplete="tel"
        />
      </div>

      <!-- 3. 음료 선택 (드롭다운) -->
      <div class="form-group">
        <label for="drink-select">
          음료 선택 <span class="required" aria-label="필수">*</span>
        </label>
        <select id="drink-select" name="drink-select" required>
          <!-- 기본 안내 옵션 (가격 없음) -->
          <option value="" data-price="0">-- 음료를 선택하세요 --</option>

          <!-- 각 음료의 가격을 data-price 속성에 숫자로 저장 -->
          <option value="americano"    data-price="3500">아메리카노 3,500원</option>
          <option value="cafe-latte"   data-price="4000">카페라떼 4,000원</option>
          <option value="cafe-mocha"   data-price="4500">카페모카 4,500원</option>
          <option value="vanilla-latte" data-price="4500">바닐라라떼 4,500원</option>
          <option value="green-latte"  data-price="4500">녹차라떼 4,500원</option>
          <option value="strawberry-latte"    data-price="4500">딸기라떼 4,500원</option>
        </select>
        <!-- 음료 미선택 오류 메시지 -->
        <span class="error-msg" id="drink-error" aria-live="polite"></span>
      </div>

      <!-- 4. 사이즈 (라디오 버튼) -->
      <div class="form-group">
        <fieldset>
          <legend>
            사이즈 <span class="required" aria-label="필수">*</span>
          </legend>

          <!-- S 사이즈 (+0원) -->
          <label class="radio-label" for="size-s">
            <input
              type="radio"
              id="size-s"
              name="size"
              value="S"
              data-price="0"
            />
            S &nbsp;<span class="price-hint">+0원</span>
          </label>

          <!-- M 사이즈 (+500원) — 기본 선택 -->
          <label class="radio-label" for="size-m">
            <input
              type="radio"
              id="size-m"
              name="size"
              value="M"
              data-price="500"
              checked
            />
            M &nbsp;<span class="price-hint">+500원</span>
          </label>

          <!-- L 사이즈 (+1,000원) -->
          <label class="radio-label" for="size-l">
            <input
              type="radio"
              id="size-l"
              name="size"
              value="L"
              data-price="1000"
            />
            L &nbsp;<span class="price-hint">+1,000원</span>
          </label>
        </fieldset>
      </div>

      <!-- 5. 추가 옵션 (체크박스) -->
      <div class="form-group">
        <fieldset>
          <legend>추가 옵션</legend>

          <!-- 샷 추가 (+500원) -->
          <label class="checkbox-label" for="opt-shot">
            <input
              type="checkbox"
              id="opt-shot"
              name="options"
              value="shot"
              data-price="500"
            />
            샷 추가 &nbsp;<span class="price-hint">+500원</span>
          </label>

          <!-- 크림 추가 (+500원) -->
          <label class="checkbox-label" for="opt-cream">
            <input
              type="checkbox"
              id="opt-cream"
              name="options"
              value="cream"
              data-price="500"
            />
            크림 추가 &nbsp;<span class="price-hint">+500원</span>
          </label>

          <!-- 시럽 추가 (+300원) -->
          <label class="checkbox-label" for="opt-syrup">
            <input
              type="checkbox"
              id="opt-syrup"
              name="options"
              value="syrup"
              data-price="300"
            />
            시럽 추가 &nbsp;<span class="price-hint">+300원</span>
          </label>

          <!-- 디카페인 (+0원) -->
          <label class="checkbox-label" for="opt-decaf">
            <input
              type="checkbox"
              id="opt-decaf"
              name="options"
              value="decaf"
              data-price="0"
            />
            디카페인 &nbsp;<span class="price-hint">+0원</span>
          </label>
        </fieldset>
      </div>

      <!-- 6. 수량 (number, 1~10, 기본값 1) -->
      <div class="form-group">
        <label for="quantity">수량</label>
        <input
          type="number"
          id="quantity"
          name="quantity"
          min="1"
          max="10"
          value="1"
        />
      </div>

      <!-- 7. 요청사항 (textarea) -->
      <div class="form-group">
        <label for="request">요청사항</label>
        <textarea
          id="request"
          name="request"
          rows="4"
          placeholder="예: 설탕 적게, 얼음 없이 등"
        ></textarea>
      </div>

      <!-- 8. 예상 금액 표시 영역 (주문하기 버튼 바로 위) -->
      <div class="price-preview" id="price-preview" aria-live="polite">
        예상 금액: <strong id="total-price">0</strong>원
      </div>

      <!-- 9. 주문하기 버튼 -->
      <button type="submit" id="btn-submit" class="btn btn-primary">
        주문하기
      </button>

      <!-- 10. 다시 작성 버튼 -->
      <button type="reset" id="btn-reset" class="btn btn-secondary">
        다시 작성
      </button>

    </form><!-- /#order-form -->

    <!-- 11. 주문 확인 메시지 영역 (처음에는 숨김, JavaScript가 제어) -->
    <div
      id="order-confirm"
      class="order-confirm hidden"
      role="alert"
      aria-live="assertive"
    >
      <!-- 주문 완료 후 JavaScript가 내용을 동적으로 삽입 -->
    </div>

    </div><!-- /#panel-order -->

    <!-- ===== 주문 내역 탭 패널 ===== -->
    <div id="panel-history" class="tab-panel hidden" role="tabpanel" aria-labelledby="tab-btn-history">

      <!-- 주문이 없을 때 보여줄 안내 메시지 -->
      <p id="orders-empty" class="orders-empty">아직 주문 내역이 없어요 ☕</p>

      <!-- 주문 카드들이 여기에 삽입됨 (JavaScript의 renderOrders()가 제어) -->
      <div id="orders-list"></div>

      <!-- 합계 + 전체 삭제 버튼 (주문이 1건 이상일 때만 표시) -->
      <div id="orders-summary" class="orders-summary hidden">
        <!-- 총 주문 금액 텍스트 (JavaScript가 textContent로 삽입) -->
        <p id="orders-total" class="orders-total-text"></p>
        <button type="button" id="btn-clear-all" class="btn btn-danger">
          내역 모두 지우기
        </button>
      </div>

    </div><!-- /#panel-history -->

  </main><!-- /.order-container -->

  <!-- Supabase JS v2 CDN
       script.js보다 먼저 로드해야 supabase 전역 객체를 사용할 수 있습니다 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 주문서 기능 스크립트 (DOM 파싱 완료 후 실행되도록 body 끝에 배치) -->
  <script src="script.js"></script>
</body>
</html>
